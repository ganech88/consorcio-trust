name: Backup DB

# Backup automatico diario de la base (Supabase free tier no tiene PITR).
# Sube el JSON como artifact privado del repo (retencion 90 dias).
# Requiere secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC (~03:00 ART) todos los dias
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: consorciotrust-backup-${{ github.run_id }}
          path: backups/*.json
          retention-days: 90
          if-no-files-found: error
